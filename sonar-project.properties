sonar.organization=WorkshopEpsi
sonar.projectKey=TomWilkRavoux_WorkshopM1Back
sonar.projectName=WorkshopM1Back

# Analyse Python
sonar.sources=.
sonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**

# Tests (facultatif mais recommandé si tu crées /tests)
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Couverture pytest-cov (XML) générée par la CI
sonar.python.coverage.reportPaths=coverage.xml

# Version Python
sonar.python.version=3.11
